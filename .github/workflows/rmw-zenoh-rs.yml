name: rmw_zenoh_rs Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'book/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/mdbook-preview.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/test.yml'
      - '.github/workflows/semantic-pr.yml'
      - '.github/workflows/pr-draft-check.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'book/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/mdbook-preview.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/test.yml'
      - '.github/workflows/semantic-pr.yml'
      - '.github/workflows/pr-draft-check.yml'
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'CTest filter regex (e.g., test_publisher|test_node) - empty for all rcl+rclcpp tests'
        required: false
        default: ''

jobs:
  rmw_zenoh_rs_test:
    name: rmw_zenoh_rs with ROS 2 Jazzy
    runs-on: ubuntu-latest
    # Skip for draft PRs to save CI time during development
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false
    container:
      image: rostooling/setup-ros-docker:ubuntu-noble-ros-jazzy-ros-base-latest

    steps:
      - name: Install system dependencies
        run: apt-get update && apt-get install -y git curl nodejs

      - name: Install ROS dependencies
        run: |
          apt-get install -y \
            ros-jazzy-rmw \
            ros-jazzy-rcutils \
            ros-jazzy-rcpputils \
            ros-jazzy-fastcdr \
            ros-jazzy-rosidl-typesupport-fastrtps-c \
            ros-jazzy-rosidl-typesupport-fastrtps-cpp \
            ros-jazzy-rmw-zenoh-cpp \
            ros-jazzy-demo-nodes-cpp \
            ros-jazzy-mimick-vendor \
            ros-jazzy-test-msgs \
            ros-jazzy-osrf-testing-tools-cpp

      - name: Checkout ros-z
        uses: actions/checkout@v4
        with:
          path: ros-z

      - name: Checkout rcl fork
        uses: actions/checkout@v4
        with:
          repository: YuanYuYuan/rcl
          ref: patch-rmwz/jazzy
          path: rcl

      - name: Checkout rclcpp fork
        uses: actions/checkout@v4
        with:
          repository: YuanYuYuan/rclcpp
          ref: patch-rmwz/jazzy
          path: rclcpp

      - name: Setup workspace
        run: |
          mkdir -p ws/src
          cp -r $GITHUB_WORKSPACE/rcl ws/src/rcl
          cp -r $GITHUB_WORKSPACE/rclcpp ws/src/rclcpp

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Nushell
        run: |
          NU_VERSION=0.110.0
          NU_PKG=nu-${NU_VERSION}-x86_64-unknown-linux-gnu
          NU_URL=https://github.com/nushell/nushell/releases/download
          curl -L ${NU_URL}/${NU_VERSION}/${NU_PKG}.tar.gz | tar xz
          mv ${NU_PKG}/nu /usr/local/bin/
          chmod +x ros-z/scripts/test-ros-packages.nu

      - name: Test RCL packages
        shell: bash
        run: |
          cd ros-z
          source /opt/ros/jazzy/setup.bash
          # Test rcl: run all tests
          nu scripts/test-ros-packages.nu \
            --ws-dir $GITHUB_WORKSPACE/ws \
            --rmw-path $GITHUB_WORKSPACE/ros-z/rmw-zenoh-rs \
            --packages rcl \
            --verbose \
            --exclude-filter "test_count_matched|test_events"

      - name: Test RCLCPP packages (RMW-relevant tests only)
        shell: bash
        run: |
          cd ros-z
          source /opt/ros/jazzy/setup.bash
          # Test rclcpp: run only RMW-relevant tests (node, publisher, subscriber, service, client, graph)
          nu scripts/test-ros-packages.nu \
            --ws-dir $GITHUB_WORKSPACE/ws \
            --rmw-path $GITHUB_WORKSPACE/ros-z/rmw-zenoh-rs \
            --packages rclcpp \
            --verbose \
            --include-filter "test_node|test_publisher|test_subscription|test_service|test_client|test_node_graph" \
            --exclude-filter "test_count_matched|test_events"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmw-zenoh-rs-test-results
          path: ws/log/latest_test/
          retention-days: 7
